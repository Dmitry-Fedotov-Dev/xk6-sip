name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: xk6 build
        run: |
          go install go.k6.io/xk6@latest
          xk6 build v2.3.0 --with github.com/Dmitry-Fedotov-Dev/xk6-sip=. --output k6
          ./k6 version

  functional:
    # Call-flow scenarios from examples/functional against the test PBX:
    # every step checked, JUnit reports and the WAV of failed audio checks
    # kept as artifacts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: build k6 and testpbx
        run: |
          go install go.k6.io/xk6@latest
          mkdir -p bin
          xk6 build v2.3.0 --with github.com/Dmitry-Fedotov-Dev/xk6-sip=. --output bin/k6
          go build -o bin/testpbx ./cmd/testpbx
      - name: run scenarios
        run: |
          ./bin/testpbx -addr 127.0.0.1:5070 -users 3 > testpbx.log 2>&1 &
          sleep 1
          mkdir -p reports
          cd examples/functional
          failed=0
          for s in basic-call hold blind-transfer attended-transfer audio-quality reject-cancel; do
            echo "::group::$s"
            if ! ../../bin/k6 run -q -e JUNIT="../../reports/$s.xml" -e RECORD_DIR=../../reports/recordings "$s.js"; then
              echo "::error title=functional::$s failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
      - name: keep reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functional-reports
          path: |
            reports/
            testpbx.log
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # xk6 lint checks tags
      - uses: actions/setup-go@v7
        with:
          go-version: stable # govulncheck also scans the toolchain stdlib
      - name: xk6 lint
        run: |
          go install go.k6.io/xk6@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          xk6 lint --k6-repo go.k6.io/k6/v2
