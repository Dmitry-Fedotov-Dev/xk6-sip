name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: xk6 build
        run: |
          go install go.k6.io/xk6@latest
          xk6 build v2.3.0 --with github.com/Dmitry-Fedotov-Dev/xk6-sip=. --output k6
          ./k6 version

  functional:
    # Call-flow scenarios from examples/functional against the test PBX:
    # every step checked, JUnit reports and the WAV of failed audio checks
    # kept as artifacts.
    runs-on: ubuntu-latest
    env:
      SCENARIOS: basic-call hold blind-transfer attended-transfer audio-quality reject-cancel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: build k6 and testpbx
        run: |
          go install go.k6.io/xk6@latest
          mkdir -p bin
          xk6 build v2.3.0 --with github.com/Dmitry-Fedotov-Dev/xk6-sip=. --output bin/k6
          go build -o bin/testpbx ./cmd/testpbx
      - name: run scenarios
        run: |
          ./bin/testpbx -addr 127.0.0.1:5070 -users 3 > testpbx.log 2>&1 &
          sleep 1
          mkdir -p reports
          cd examples/functional
          failed=0
          for s in $SCENARIOS; do
            echo "::group::$s"
            if ! ../../bin/k6 run -q -e JUNIT="../../reports/$s.xml" -e RECORD_DIR=../../reports/recordings "$s.js"; then
              echo "::error title=functional::$s failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
      - name: summary
        # the overview in this log, on the run's summary page and in the artifact
        if: always()
        run: |
          mkdir -p reports
          python3 .github/scripts/summary.py functional reports $SCENARIOS > reports/summary.md
          sed -E 's#</?(details|summary)[^>]*>##g' reports/summary.md
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: keep reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functional-reports
          path: |
            reports/
            testpbx.log
          if-no-files-found: ignore

  load:
    # A short load run against the test PBX with Prometheus and Grafana:
    # k6 thresholds decide pass/fail, and the whole dashboard for the run's
    # time window is kept as a PNG report next to the k6 summary.
    runs-on: ubuntu-latest
    env:
      TESTID: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: build k6 and testpbx
        run: |
          go install go.k6.io/xk6@latest
          mkdir -p bin reports
          xk6 build v2.3.0 --with github.com/Dmitry-Fedotov-Dev/xk6-sip=. --output bin/k6
          go build -o bin/testpbx ./cmd/testpbx
      - name: start monitoring and the test PBX
        run: |
          docker compose -f monitoring/docker-compose.yml --profile linux-host up -d
          ./bin/testpbx -addr 127.0.0.1:5070 -users 200 -csv examples/subscribers.csv > reports/testpbx.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:3001/api/health >/dev/null; do sleep 2; done'
      - name: load test
        env:
          K6_PROMETHEUS_RW_SERVER_URL: http://localhost:9091/api/v1/write
          K6_FEATURES: native-histograms
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          # 0.0.0.0: Prometheus in Docker reaches the k6 process through the host gateway.
          ./bin/k6 run -o experimental-prometheus-rw --tag testid="$TESTID" --tag pbx_version=testpbx \
            -e VUS=20 -e DURATION=2m -e HOLD=5 -e AUDIO=1 -e SIP_METRICS_ADDR=0.0.0.0:6566 \
            --summary-export reports/summary.json examples/call.js | tee reports/k6.txt
      - name: dashboard report
        if: always()
        run: |
          sleep 15 # the last remote write and scrape
          bash monitoring/report.sh "$TESTID" $((START - 30)) $(($(date +%s) - 10)) reports/dashboard.png
      - name: summary
        # the key metrics in this log, on the run's summary page and in the artifact
        if: always()
        run: |
          if [ -f reports/summary.json ]; then
            python3 .github/scripts/summary.py load reports/summary.json \
              "20 VUs for 2 minutes against the test PBX, audio compared on every call." > reports/summary.md
            cat reports/summary.md
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: keep reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-report
          path: reports/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # xk6 lint checks tags
      - uses: actions/setup-go@v7
        with:
          go-version: stable # govulncheck also scans the toolchain stdlib
      - name: xk6 lint
        run: |
          go install go.k6.io/xk6@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          xk6 lint --k6-repo go.k6.io/k6/v2
