# k6 pushes test metrics with remote write. Prometheus scrapes:
#  - the k6 process itself (sip.options({ metricsAddr: '127.0.0.1:6566' })):
#    CPU, memory, goroutines, SIP/RTP traffic of the load generator;
#  - the load generator machine: windows_exporter on Windows hosts, or the
#    node-exporter service (profile "linux-host") on Linux hosts.
# Targets that are not running show as down; that is expected between runs.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: k6
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:6566"]

  - job_name: host
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9182"] # windows_exporter on the host
        labels: { exporter: windows }
      - targets: ["node-exporter:9100"] # docker compose --profile linux-host
        labels: { exporter: node }
